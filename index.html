<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aya</title>
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
  </head>
  <body>
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z"/></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2.5"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></symbol>
      <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6M12 2v3"/></symbol>
      <symbol id="i-walk" viewBox="0 0 24 24"><circle cx="13" cy="4" r="2"/><path d="m9 21 2-6 3 3v3M7 12l2-4 4 1 2 4 3 1M11 15l-1-5"/></symbol>
      <symbol id="i-ear" viewBox="0 0 24 24"><path d="M6 9a6 6 0 1 1 12 0c0 3-2 4-3 5.5S14 18 12 20a3 3 0 0 1-4-1"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-1.5 2-1.5 3.5"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.6v12.8a.8.8 0 0 0 1.2.7l10-6.4a.8.8 0 0 0 0-1.4l-10-6.4a.8.8 0 0 0-1.2.7z"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6.5 6v12"/><path d="M18 6.7v10.6a.7.7 0 0 1-1.1.6l-7.7-5.3a.7.7 0 0 1 0-1.2l7.7-5.3a.7.7 0 0 1 1.1.6z"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M17.5 6v12"/><path d="M6 6.7v10.6a.7.7 0 0 0 1.1.6l7.7-5.3a.7.7 0 0 0 0-1.2L7.1 6.1A.7.7 0 0 0 6 6.7z"/></symbol>
      <symbol id="i-vol-down" viewBox="0 0 24 24"><path d="M3.5 9.5h3L11 5.8v12.4l-4.5-3.7h-3z"/><path d="M15 12h5.5"/></symbol>
      <symbol id="i-vol-up" viewBox="0 0 24 24"><path d="M3.5 9.5h3L11 5.8v12.4l-4.5-3.7h-3z"/><path d="M15 12h5.5M17.75 9.25v5.5"/></symbol>
      <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 17.5V6l10-2v11.5"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="15.5" r="2.5"/></symbol>
      <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 6.1A9.8 9.8 0 0 1 12 6c5.5 0 9 6 9 6a15.6 15.6 0 0 1-3.2 3.8M6.6 6.6C4.3 8.1 3 12 3 12s3.5 6 9 6a9 9 0 0 0 4.4-1.1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
    </svg>

    <div id="stage"></div>

    <!-- реплика над головой -->
    <div id="bubble" class="bubble" aria-live="polite">
      <div class="bubble-name" id="bubble-name">Ая</div>
      <div class="bubble-text" id="bubble-text"></div>
    </div>

    <!-- док рядом с аватаром -->
    <div id="dock" class="dock">
      <button id="open-panel" class="dock-btn" aria-label="Открыть чат" title="Чат (двойной клик по Ае)">
        <svg class="ic"><use href="#i-chat" /></svg>
      </button>
      <button id="dock-mic" class="dock-btn" aria-label="Держи, чтобы сказать" title="Держи и говори">
        <svg class="ic"><use href="#i-mic" /></svg>
      </button>
      <button id="pomo" class="dock-pomo hidden" title="Помодоро — нажми, чтобы остановить"><span id="pomo-time">25:00</span></button>
      <button id="dock-more" class="dock-btn small" aria-label="Меню" title="Меню (правый клик по Ае)">
        <svg class="ic"><use href="#i-more" /></svg>
      </button>
    </div>

    <!-- плеер: Яндекс Музыка, которая играет в самой Ае -->
    <div id="mbar" class="mbar hidden" role="group" aria-label="Плеер Яндекс Музыки">
      <div class="mb-track">
        <svg class="ic mb-note" aria-hidden="true"><use href="#i-note" /></svg>
        <div class="mb-text"><b data-mb-title></b><span data-mb-artist></span></div>
        <button class="mb-btn mb-close" data-mb="stop" aria-label="Выключить музыку" title="Выключить музыку">
          <svg class="ic"><use href="#i-close" /></svg>
        </button>
      </div>
      <div class="mb-controls">
        <button class="mb-btn" data-mb="prev" aria-label="Предыдущий трек" title="Предыдущий трек"><svg class="ic solid"><use href="#i-prev" /></svg></button>
        <button class="mb-btn mb-play" data-mb="toggle" aria-label="Пауза" title="Пауза"><svg class="ic solid"><use href="#i-pause" /></svg></button>
        <button class="mb-btn" data-mb="next" aria-label="Следующий трек" title="Следующий трек"><svg class="ic solid"><use href="#i-next" /></svg></button>
        <span class="mb-sep" aria-hidden="true"></span>
        <button class="mb-btn" data-mb="voldown" aria-label="Тише" title="Тише"><svg class="ic"><use href="#i-vol-down" /></svg></button>
        <output class="mb-vol" data-mb-vol aria-label="Громкость музыки">100%</output>
        <button class="mb-btn" data-mb="volup" aria-label="Громче" title="Громче"><svg class="ic"><use href="#i-vol-up" /></svg></button>
      </div>
    </div>

    <!-- панель чата -->
    <section id="panel" class="panel hidden" aria-label="Чат">
      <header class="panel-head" data-tauri-drag-region>
        <div class="who" data-tauri-drag-region>
          <div class="who-mark" id="who-mark">А</div>
          <div class="who-txt" data-tauri-drag-region>
            <div class="who-name" id="who-name">Ая</div>
            <div class="who-state" id="state-chip">рядом</div>
          </div>
        </div>
        <button id="stop-all" class="icon-btn danger hidden" aria-label="Остановить" title="Остановить речь и ожидание">
          <svg class="ic"><use href="#i-stop" /></svg>
        </button>
        <button id="quick-toggle" class="icon-btn" aria-label="Быстрые настройки" title="Быстрые настройки">
          <svg class="ic"><use href="#i-sliders" /></svg>
        </button>
        <button id="panel-close" class="icon-btn" aria-label="Свернуть" title="Свернуть (Esc)">
          <svg class="ic"><use href="#i-close" /></svg>
        </button>
      </header>

      <div id="view-chat" class="view">
        <div id="messages" class="messages"></div>
        <div id="voice-hint" class="voice-hint"></div>
        <form id="chat-form" class="composer">
          <button id="mic" type="button" class="comp-btn" aria-label="Держи для записи" title="Держи и говори">
            <svg class="ic"><use href="#i-mic" /></svg>
          </button>
          <textarea id="chat-input" rows="1" autocomplete="off" placeholder="Напиши ей…" aria-label="Сообщение"></textarea>
          <button type="submit" class="comp-btn send" aria-label="Отправить" title="Отправить (Enter)">
            <svg class="ic"><use href="#i-send" /></svg>
          </button>
        </form>
      </div>

      <div id="view-quick" class="view quick hidden">
        <div class="q-group">
          <label class="q-row"><span><b>Озвучка</b><small>говорить ответы голосом</small></span><input type="checkbox" class="tgl" data-q="tts_enabled" /></label>
          <label class="q-row"><span><b>«Ая, …»</b><small>откликается на имя, без кнопок</small></span><input type="checkbox" class="tgl" data-q="wake_word" /></label>
          <label class="q-row"><span><b>Прогулки</b><small>сама ходит по рабочему столу</small></span><input type="checkbox" class="tgl" data-q="avatar_walk" /></label>
          <label class="q-row"><span><b>Тишина</b><small>не заговаривать первой</small></span><input type="checkbox" class="tgl" data-q="focus" /></label>
          <label class="q-row"><span><b>Свободные руки</b><small>слушать после ответа</small></span><input type="checkbox" class="tgl" data-q="followup" /></label>
          <label class="q-row"><span><b>Реакции</b><small>отвечать на касания</small></span><input type="checkbox" class="tgl" data-q="avatar_reactions" /></label>
          <label class="q-row"><span><b>Жизнь в простое</b><small>оглядывается, дремлет</small></span><input type="checkbox" class="tgl" data-q="avatar_idle_life" /></label>
          <label class="q-row"><span><b>Сквозь пустоту</b><small>клики мимо Аи — на рабочий стол</small></span><input type="checkbox" class="tgl" data-q="click_through" /></label>
        </div>
        <div class="q-group">
          <div class="q-slider"><span>Громкость</span><input type="range" min="0" max="300" step="5" data-q="tts_volume" /><output id="q-vol">100%</output></div>
          <div class="q-slider"><span>Размер</span><input type="range" min="50" max="160" step="5" data-q="avatar_scale" /><output id="q-scale">100%</output></div>
        </div>
        <div class="q-group">
          <div class="q-label">Микрофон</div>
          <div class="seg" id="q-voice-mode">
            <button data-mode="button">Кнопка</button>
            <button data-mode="auto">По голосу</button>
            <button data-mode="hotkey">Ctrl+Space</button>
          </div>
        </div>
        <div class="q-actions">
          <button class="btn ghost" id="q-console"><svg class="ic"><use href="#i-gear" /></svg>Консоль</button>
          <button class="btn grad" id="q-wizard"><svg class="ic"><use href="#i-spark" /></svg>Собрать Аю</button>
        </div>
      </div>
    </section>

    <!-- контекстное меню аватара -->
    <div id="menu" class="menu hidden" role="menu">
      <button data-act="chat" role="menuitem"><svg class="ic"><use href="#i-chat" /></svg>Поговорить</button>
      <button data-act="pat" role="menuitem"><svg class="ic"><use href="#i-heart" /></svg>Погладить</button>
      <button data-act="focus" role="menuitem"><svg class="ic"><use href="#i-moon" /></svg><span data-label="focus">Тишина</span></button>
      <button data-act="pomodoro" role="menuitem"><svg class="ic"><use href="#i-timer" /></svg><span data-label="pomodoro">Помодоро 25/5</span></button>
      <div class="menu-sep"></div>
      <div class="menu-row games">
        <span>Сыграем</span>
        <button data-act="game" data-game="cities" title="Города">Города</button>
        <button data-act="game" data-game="riddle" title="Загадка">Загадка</button>
        <button data-act="game" data-game="quiz" title="Викторина">Квиз</button>
      </div>
      <div class="menu-sep"></div>
      <div class="menu-row">
        <span>Размер</span>
        <button data-act="smaller" aria-label="Меньше">−</button>
        <button data-act="bigger" aria-label="Больше">+</button>
      </div>
      <div class="menu-sep"></div>
      <button data-act="wizard" role="menuitem"><svg class="ic"><use href="#i-spark" /></svg>Собрать Аю</button>
      <button data-act="console" role="menuitem"><svg class="ic"><use href="#i-gear" /></svg>Консоль</button>
      <button data-act="walk" role="menuitem"><svg class="ic"><use href="#i-walk" /></svg><span data-label="walk">Гулять по экрану</span></button>
      <button data-act="wake" role="menuitem"><svg class="ic"><use href="#i-ear" /></svg><span data-label="wake">Слушать «Ая, …»</span></button>
      <button data-act="hide" role="menuitem"><svg class="ic"><use href="#i-eye-off" /></svg>Спрятать <kbd>Alt+Shift+A</kbd></button>
    </div>

    <div id="toast" class="toast"></div>
    <div id="drop-hint" class="drop-hint hidden"><svg class="ic"><use href="#i-spark" /></svg><span>Брось — посмотрю</span></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
